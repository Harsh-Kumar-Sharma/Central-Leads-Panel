# Central Leads Panel - Nginx site (template)
# Installed by: bash deploy/deploy.sh --nginx      (DOMAIN defaults to clp.cpaleasing.com)
#   -> /etc/nginx/sites-available/clp.cpaleasing.com  (+ symlink in sites-enabled)
#   __DOMAIN__ / __WEB_ROOT__ / __API_PORT__ are filled in by the script.
# Then enable HTTPS with:  sudo certbot --nginx -d clp.cpaleasing.com
# (certbot adds the 443 server block and the http -> https redirect to this file)

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    server_tokens off;
    client_max_body_size 100k;

    # ---------- Live notifications (Server-Sent Events): never buffer, keep open ----------
    location = /api/notifications/stream {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;   # overwrite: never trust client-sent values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # ---------- API (public lead ingest + dashboard API) ----------
    location /api/ {
        proxy_pass http://127.0.0.1:__API_PORT__;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # Excel export of large result sets
    }

    # ---------- Dashboard (Vue SPA build) ----------
    root __WEB_ROOT__;
    index index.html;

    # NOTE: no add_header inside these locations - in Nginx that would silently drop the
    # security headers defined at the bottom of this server block. Caching uses `expires`.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;            # index.html: always revalidate, so a new deploy shows up at once
    }

    # Hashed build assets never change: cache for a year.
    location /assets/ {
        expires 1y;
        access_log off;
    }

    location ~ /\. { deny all; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
}
